name: Android 출시용 AAB

# v로 시작하는 태그(예: v1.0.1)를 올리거나 Actions 탭에서 수동 실행. 결과 AAB를 Play Console에 업로드
on:
  push:
    branches: ['build/aab-20261026-latest']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: '버전 이름 (예: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm ci
          npm run build:www
          npx cap sync android
      - name: 업로드 키 복원
        run: echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}" | tr -d ' \r\n' | base64 -d > $RUNNER_TEMP/upload.jks
      - name: 업로드 키 확인
        env:
          PW: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          echo "::notice::keystore $(stat -c %s $RUNNER_TEMP/upload.jks) bytes, pw ${#PW} chars, alias ${#ALIAS} chars"
          keytool -list -keystore $RUNNER_TEMP/upload.jks -storepass "$PW" -alias "$ALIAS" > /tmp/kt.txt 2>&1 || { echo "::error::keytool: $(tail -2 /tmp/kt.txt | tr '\n' ' ')"; exit 1; }
          echo "::notice::$(grep -i 'SHA-256' /tmp/kt.txt)"
      - name: 서명된 AAB 빌드
        working-directory: android
        env:
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name || (startsWith(github.ref_name, 'v') && github.ref_name) || '1.0.0' }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon > /tmp/gradle.txt 2>&1 || { grep -A6 "What went wrong" /tmp/gradle.txt | head -8 | while read -r l; do echo "::error::$l"; done; tail -5 /tmp/gradle.txt; exit 1; }
          tail -3 /tmp/gradle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: capybara-onsen-${{ inputs.version_name || (startsWith(github.ref_name, 'v') && github.ref_name) || '1.0.0' }}-${{ github.run_number }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
