<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>카피바라 온센 — CAPYBARA ONSEN · 료칸 타이쿤</title>
<link rel="stylesheet" href="assets/fonts/pretendard.css?v=202610252242">
<link rel="icon" type="image/png" href="assets/emblem.png">
<meta name="theme-color" content="#0e1117">
<meta name="description" content="카피바라 손님이 쉬어가는 픽셀 아트 온천 료칸 타이쿤">
<link rel="stylesheet" href="style.css?v=202610252242">
</head><body>
<canvas id="c"></canvas><canvas id="tc"></canvas>
<div id="top">
 <div class="box"><span class="coin">¥</span><b id="yen">0</b></div>
 <div class="box"><span class="hud-lbl">수익</span><b id="ihr">+0 ¥/시</b></div>
 <div class="box clock"><div><span id="sun" hidden></span><b id="time">오전 09:00</b> · <span id="dayn">Day 1</span></div><div class="sub"><span id="season">봄</span> <span id="temp"></span></div></div>
 <div class="box btn" id="bRank" title="료칸 등급 · 승급 조건 보기"><span class="hud-lbl">등급</span> <b id="stars" class="stars"></b></div>
 <div class="sp"></div>
 <div class="box btn" id="bSpeed" title="속도">1x</div>
</div>
<div id="build">
 <div class="bh"><span>시설 건설</span><button id="bClose" aria-label="닫기">닫기</button></div>
 <div class="tabs" id="tabs"></div>
 <div class="cards" id="cards"></div>
 <div class="tip" id="tip">탕은 손님의 피로를 풀어주고 만족도를 높여요.</div>
</div>
<button id="bOpen" class="box btn">시설 건설</button>
<div id="tools">
 <button class="tool" id="tFin" title="재정"><i>재정</i></button>
 <button class="tool" id="tGuest" title="손님"><i>손님</i></button>
 <button class="tool" id="tDel" title="철거"><i>철거</i></button>
 <div class="zoom box"><button id="zOut" title="축소">−</button><input id="zs" type="range" min="0.5" max="8" step="0.05"><button id="zIn" title="확대">＋</button><button id="zHome" title="중앙으로">중앙</button></div>
</div>
<div id="info" class="panel"></div>
<div id="modal" class="panel"></div>
<div id="toast"></div>
<div id="warn"></div>
<button id="ghRot" class="box" style="display:none;position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:6;padding:6px 14px;font-weight:700">회전 (R)</button><div id="moveBar" class="box"><span>이동 중 — 놓을 곳을 눌러주세요</span><button id="mvRot" title="회전 (R)">회전 R</button><button id="mvCancel">취소</button></div>
<script src="diag.js?v=202610252242"></script>
<script src="assets/icons.js?v=202610252242"></script>
<script src="save.js?v=202610252242"></script>
<script src="assets/water.js?v=202610252242"></script><script src="assets/water_extra.js?v=202610252242"></script><script src="assets/lights.js?v=202610252242"></script>
<script src="assets/fonts/glyphs.js?v=202610252242"></script>
<script src="game.js?v=202610252242"></script>
<script src="audio.js?v=202610252242"></script>
<script src="meta.js?v=202610252242"></script>
<script src="ambient.js?v=202610252242"></script>
<script src="photo.js?v=202610252242"></script>
<script src="fx.js?v=202610252242"></script>
<script src="shell.js?v=202610252242"></script>
<script src="mobile.js?v=202610252242"></script>
</body></html>
