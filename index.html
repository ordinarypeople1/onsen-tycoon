<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>유자 온센 료칸 타이쿤</title>
<link rel="preload" href="assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/png" href="assets/emblem.png">
<meta name="theme-color" content="#2f3a2a">
<meta name="description" content="카피바라 손님이 쉬어가는 픽셀 아트 온천 료칸 타이쿤">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas><canvas id="tc"></canvas>
<div id="top">
 <div class="box"><span class="coin">¥</span><b id="yen">0</b></div>
 <div class="box"><span>📈</span><b id="ihr">+0 ¥/시</b></div>
 <div class="box clock"><div><span id="sun">☀️</span> <b id="time">오전 09:00</b> · <span id="dayn">Day 1</span></div><div class="sub"><span id="season">봄</span> <span id="temp"></span></div></div>
 <div class="box"><span>료칸 등급</span> <b id="stars" class="stars"></b></div>
 <div class="sp"></div>
 <div class="box btn" id="bSpeed" title="속도">▶ x1</div>
</div>
<div id="build">
 <div class="bh"><span>🔨 건설</span><button id="bClose">✕</button></div>
 <div class="tabs" id="tabs"></div>
 <div class="cards" id="cards"></div>
 <div class="tip" id="tip">🍃 탕은 손님의 피로를 풀어주고 만족도를 높여요!</div>
</div>
<button id="bOpen" class="box btn">🔨 건설</button>
<div id="tools">
 <button class="tool" id="tFin" title="재정">📊<i>재정</i></button>
 <button class="tool" id="tGuest" title="손님">🦫<i>손님</i></button>
 <button class="tool" id="tDel" title="철거">🧹<i>철거</i></button>
 <div class="zoom box"><button id="zOut">−</button><input id="zs" type="range" min="0.5" max="8" step="0.05"><button id="zIn">＋</button><button id="zHome" title="탕으로">⌂</button></div>
</div>
<div id="info" class="panel"></div>
<div id="modal" class="panel"></div>
<div id="toast"></div>
<div id="warn"></div>
<button id="ghRot" class="box" style="display:none;position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:6;padding:6px 14px;font-weight:700">회전 (R)</button><div id="moveBar" class="box"><span>🔀 이동 중 — 놓을 곳을 눌러주세요</span><button id="mvRot" title="회전 (R)">회전 R</button><button id="mvCancel">취소</button></div>
<script src="diag.js"></script>
<script src="assets/icons.js"></script>
<script src="save.js"></script>
<script src="assets/water.js"></script><script src="assets/lights.js"></script>
<script src="game.js"></script>
<script src="audio.js"></script>
<script src="meta.js"></script>
<script src="ambient.js"></script>
<script src="photo.js"></script>
<script src="fx.js"></script>
<script src="shell.js"></script>
</body></html>
